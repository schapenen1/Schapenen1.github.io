<!DOCTYPE html>
<html>
<head style = color:#c1ff33>
<title>Crossword Checker</title>

<style>

body{
font-family:Arial;
text-align:center;
margin-top:40px;
background-color: #c1ff33;
position: relative;
}

body::before{
content: '';
position: fixed;
top: -50%;
left: -50%;
width: 200%;
height: 200%;
background-image: url('ProtoLogo.png');
background-size: 300px 300px;
background-repeat: repeat;
transform: rotate(45deg);
z-index: -1;
pointer-events: none;
}

img{
width: 75%;
border:2px solid black;
margin-bottom:20px;
}

input{
padding:10px;
font-size:16px;
}

button{
padding:10px 20px;
font-size:16px;
margin-top:10px;
font-weight: bold;
}
.text-box {
        background-color: white;
        padding: 30px 50px;
        border-radius: 10px;
        display: inline-block;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        border: 3px solid black;
    }

</style>

</head>

<body>
<div class="text-box">
<h1> Good luck completing the puzzle!</h1>
<img src="CodeWord.jpg" alt="Crossword Puzzle" >
</div>
<br>

<div class="text-box">
<p > All Caps, No Spaces</p>

<input type="text" id="answer" placeholder="Enter the answer here">

<br>

<button onclick="checkAnswer()">Check if the answer is correct</button>

<p id="result"></p>

</div>

<script>

const correctAnswer = "BOARD16";

function checkAnswer(){

let userAnswer = document.getElementById("answer").value.toUpperCase();

if(userAnswer === correctAnswer){

window.location.href = "correct.html";

}else{

document.getElementById("result").innerText = "Wrong answer. Try again.";

}

}

</script>

</body>
</html>
