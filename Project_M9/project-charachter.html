<script>
    // Initialize current coins
    let currentCoins = 0; 
    let categoryCount = 5
    let row = 4
    let col = 4

    const itemPrice = [
                         [
                            [10,10,10,10],
                            [10,10,10,10],
                            [10,10,10,10],
                            [10,10,10,10]
                        ],[

                        ],[

                            [10,10,10,10],

                            [10,10,10,10]
                        ],[
                            [10,10,10,10],
                            [10,10,10,10],
                            [10,10,10,10],
                            [10,10,10,10]
                        ],[
                            [10,10,10,10],
                            [10,10,10,10],
                            [10,10,10,10],
                            [10,10,10,1000]
                        ]
                    ];

    let itemStates = Array.from(
        { length: categoryCount },
        () => Array.from(
            { length: row },
            () => Array(col).fill(false)
        )
    );

    function upCoins(){
        currentCoins += coinsExercise;
        document.getElementById("coins").innerHTML = ` ${currentCoins}`;
    }

    function setCoins() {
        const URL = window.location.href;
        params = URL.split("?")[1];

        currentCoins = params ? Number(params) : 0;

        document.getElementById("coins").innerHTML = ` ${currentCoins}`;
    }

    function moveToNextPage() {
        // Go to the next page if all answers are correct, after a 3 second delay with the current coins in the URL
        if (allCorrect) {
            setTimeout(() => {
            window.location.href = `project-researchplan.html?${currentCoins}`;
            }, 3000);
        }
    }

    function showSelection(type) {
        const selection = document.getElementById("selection");
        selection.innerHTML = "";

        for (let i = 0; i < row; i++) {
            for (let j = 0; j < col; j++) {

                const item = document.createElement("div");
                item.className = "item";

                item.innerHTML = `
                    <img src="items/${type}-${i}-${j}.png"
                        alt="Clothing item"
                        style="width:100px; height:100px; object-fit:contain;">

                    <p>
                        ${itemStates[type][i][j]
                            ? "Unlocked"
                            : itemPrice[type][i][j] + " coins"}
                    </p>
                `;

                item.onclick = function () {
                    if (itemStates[type][i][j]) {
                        // Select or equip the unlocked item
                        console.log("Selected item:", type, i, j);
                    } else {
                        buyItem(type, i, j);
                        showSelection(type);
                    }
                };

                selection.appendChild(item);
            }
        }
    }

    function unlockItem (category, col, row) {
        itemStates[category][col][row] = true;
    }

    function buyItem (category, col, row) {
        if(!itemStates[category][col][row]) {
            price = itemPrice[category][col][row]
            if (currentCoins >= price) {
                downCoins(price);
                unlockItem(category,col,row);
            }
        } 
    }
    
    function unlockStart () {
        // creation empty states of owned clothing
        
        for(let i = 0; i < categoryCount; i++ ) {
            for (let j =0; j < col; j++){
                unlockItem(i,0,j);
            }
        }
        console.log(itemStates);
    }

    function downCoins (price) {
        currentCoins -= price;
        document.getElementById("coins").innerHTML = ` ${currentCoins}`;
    }
   
</script>
